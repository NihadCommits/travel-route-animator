packages:
  - apps/*
  - packages/*
  - e2e

# pnpm blocks dependency build scripts unless they are reviewed and listed here.
allowBuilds:
  # Verifies the platform-specific binary after install (used by tsx).
  esbuild: true
  # Not electron: since Electron 45 it has no install script and downloads its runtime on the
  # first start (`pnpm app`).
  # Squirrel installers, which electron-builder can make; the app is packed with NSIS instead.
  electron-winstaller: false
